[project]
name = "inventory"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "prometheus-client>=0.21",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["."]
