# Served by nginx-unprivileged (listens on 8080, runs as uid 101).
# TLS terminates at Front Door / Istio Gateway, so this is plain HTTP.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self'" always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    location /assets/ {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    # SPA fallback; index.html must never be cached so new releases show up
    location / {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }
}
