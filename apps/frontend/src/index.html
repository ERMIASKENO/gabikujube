<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ShopSphere</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <header>
    <h1>ShopSphere</h1>
    <input id="search" type="search" placeholder="Search products…" aria-label="Search products" />
    <button id="cart-button" type="button">Cart (<span id="cart-count">0</span>)</button>
  </header>
  <main>
    <section id="products" class="grid" aria-live="polite"></section>
    <aside id="cart" hidden>
      <h2>Your cart</h2>
      <ul id="cart-items"></ul>
      <button id="checkout" type="button">Checkout</button>
      <p id="checkout-result" role="status"></p>
    </aside>
  </main>
  <footer>build <span id="build"></span></footer>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
