[project]
name = "notification"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "prometheus-client>=0.21",
    "azure-servicebus>=7.12",
    "azure-identity>=1.17",
    "aiohttp>=3.10",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 130

[tool.pytest.ini_options]
pythonpath = ["."]
