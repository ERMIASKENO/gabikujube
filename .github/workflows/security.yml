# GitHub Advanced Security: CodeQL SAST for every language in the repo
# (including the workflows themselves) + dependency review on PRs.
# Secret scanning and push protection are enabled at the org level.
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 2 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: go, build-mode: autobuild }
          - { language: javascript-typescript, build-mode: none }
          - { language: python, build-mode: none }
          - { language: java-kotlin, build-mode: none }
          - { language: actions, build-mode: none }   # finds injection/permission bugs in workflows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.language == 'go'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27"
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}

  # Aggregate check name used by the ruleset ("CodeQL")
  codeql-gate:
    name: CodeQL
    if: always()
    needs: codeql
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULT: ${{ needs.codeql.result }}
        run: test "${RESULT}" = "success"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-3.0
          comment-summary-in-pr: on-failure
