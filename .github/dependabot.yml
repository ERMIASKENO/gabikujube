# Dependency updates for every ecosystem in the monorepo.
# cooldown: wait a few days before adopting a fresh release, so a compromised
# package version (npm/PyPI/action supply-chain attacks) is usually yanked
# before it ever reaches us. Grouping keeps PR noise low.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: docker
    directories: ["/apps/*"]
    schedule: { interval: weekly }
    cooldown: { default-days: 5 }
    groups:
      base-images: { patterns: ["*"], update-types: [minor, patch] }
    ignore:
      # maven:3.9-eclipse-temurin-21 is a floating tag (latest Maven 3.9 on
      # JDK 21). Dependabot reads "-21" as a version and proposes JDK 26, which
      # would not match the Java 21 runtime. JDK upgrades are done deliberately.
      - dependency-name: "maven"

  - package-ecosystem: gomod
    directories: ["/apps/product-catalog", "/apps/payment", "/apps/shipping"]
    schedule: { interval: weekly }

  - package-ecosystem: npm
    directories: ["/apps/cart", "/apps/user", "/apps/frontend"]
    schedule: { interval: weekly }
    cooldown: { default-days: 7, semver-major-days: 30 }
    groups:
      npm-minor: { update-types: [minor, patch] }

  - package-ecosystem: uv
    directories: ["/apps/inventory", "/apps/recommendation", "/apps/notification"]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      python-minor: { update-types: [minor, patch] }

  - package-ecosystem: maven
    directory: /apps/order
    schedule: { interval: weekly }
    groups:
      spring: { patterns: ["org.springframework*", "io.micrometer*"] }

  - package-ecosystem: terraform
    directories: ["/infra/terraform/stacks/*", "/infra/terraform/modules/*"]
    schedule: { interval: weekly }
    groups:
      providers: { patterns: ["*"], update-types: [minor, patch] }
    # Provider MAJOR upgrades (e.g. azurerm 4 -> 5) have breaking changes and
    # must move every module at once: done deliberately in a dedicated PR.
    # For Terraform, Dependabot widens the version CONSTRAINT (~> 4.0 -> ~> 5.15)
    # instead of bumping a version, so an update-types filter never matches.
    # Explicit version ranges are what actually block the majors.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "hashicorp/azurerm"
        versions: [">= 5.0.0"]
      - dependency-name: "Azure/azapi"
        versions: [">= 3.0.0"]
      - dependency-name: "integrations/github"
        versions: [">= 7.0.0"]
