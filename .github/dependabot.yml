# Dependency updates for every ecosystem in the monorepo.
# cooldown: wait a few days before adopting a fresh release, so a compromised
# package version (npm/PyPI/action supply-chain attacks) is usually yanked
# before it ever reaches us. Grouping keeps PR noise low.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: docker
    directories: ["/apps/*"]
    schedule: { interval: weekly }
    cooldown: { default-days: 5 }
    groups:
      base-images: { patterns: ["*"], update-types: [minor, patch] }

  - package-ecosystem: gomod
    directories: ["/apps/product-catalog", "/apps/payment", "/apps/shipping"]
    schedule: { interval: weekly }

  - package-ecosystem: npm
    directories: ["/apps/cart", "/apps/user", "/apps/frontend"]
    schedule: { interval: weekly }
    cooldown: { default-days: 7, semver-major-days: 30 }
    groups:
      npm-minor: { update-types: [minor, patch] }

  - package-ecosystem: uv
    directories: ["/apps/inventory", "/apps/recommendation", "/apps/notification"]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      python-minor: { update-types: [minor, patch] }

  - package-ecosystem: maven
    directory: /apps/order
    schedule: { interval: weekly }
    groups:
      spring: { patterns: ["org.springframework*", "io.micrometer*"] }

  - package-ecosystem: terraform
    directories: ["/infra/terraform/stacks/*", "/infra/terraform/modules/*"]
    schedule: { interval: weekly }
    groups:
      providers: { patterns: ["*"] }
