# External Secrets Operator authenticates to Key Vault with workload identity
# (its ServiceAccount is federated to a UAMI holding "Key Vault Secrets User").
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-keyvault
spec:
  conditions:
    - namespaces: ["shop"]          # only app namespace may read through this store
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://kv-shopsphere.vault.azure.net   # patched per env
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
