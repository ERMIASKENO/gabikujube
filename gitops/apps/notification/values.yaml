# notification: queue worker, scaled 0..N by KEDA on Service Bus backlog.
rollout:
  strategy: rolling
autoscaling:
  hpa: { enabled: false }
  keda:
    enabled: true
    minReplicas: 0
    maxReplicas: 20
pdb:
  enabled: false     # can legitimately run at 0 replicas
slo:
  enabled: false     # no inbound HTTP traffic; alert on DLQ depth instead
env:
  SERVICEBUS_TOPIC: order-events
  SERVICEBUS_SUBSCRIPTION: notification
