# Grafana Alloy (Promtail successor) as a DaemonSet: ships pod logs to Loki
# and receives OTLP traces from Envoy, forwarding them to Tempo.
controller:
  type: daemonset
alloy:
  extraPorts:
    - { name: otlp-grpc, port: 4317, targetPort: 4317, protocol: TCP }
  mounts:
    varlog: true
  configMap:
    content: |
      discovery.kubernetes "pods" { role = "pod" }
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule { source_labels = ["__meta_kubernetes_namespace"]       target_label = "namespace" }
        rule { source_labels = ["__meta_kubernetes_pod_label_app"]   target_label = "app" }
        rule { source_labels = ["__meta_kubernetes_pod_container_name"] target_label = "container" }
      }
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.default.receiver]
      }
      loki.write "default" {
        endpoint { url = "http://loki-gateway.monitoring.svc/loki/api/v1/push" }
      }
      otelcol.receiver.otlp "default" {
        grpc { endpoint = "0.0.0.0:4317" }
        output { traces = [otelcol.exporter.otlp.tempo.input] }
      }
      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo.monitoring.svc:4317"
          tls { insecure = true }
        }
      }
