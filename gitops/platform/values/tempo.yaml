tempo:
  retention: 72h
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: 0.0.0.0:4317 }
  metricsGenerator:
    enabled: true                         # service graph + RED metrics from traces
    remoteWriteUrl: http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/write
persistence:
  enabled: true
  size: 20Gi
