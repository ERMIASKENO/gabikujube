controller:
  replicas: 2
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels: { release: kube-prometheus-stack }
  # Gateway API traffic router (edits HTTPRoute weights for canaries)
  trafficRouterPlugins:
    - name: argoproj-labs/gatewayAPI
      location: https://github.com/argoproj-labs/rollouts-plugin-trafficrouter-gatewayapi/releases/download/v0.18.0/gatewayapi-plugin-linux-amd64
dashboard:
  enabled: true
