deploymentMode: SimpleScalable
loki:
  auth_enabled: false
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: azure
        schema: v13
        index: { prefix: loki_index_, period: 24h }
  storage:
    type: azure
    azure:
      accountName: <loki-storage-account>
      useFederatedToken: true            # workload identity, no storage keys
    bucketNames: { chunks: loki-chunks, ruler: loki-ruler, admin: loki-admin }
  limits_config:
    retention_period: 30d
serviceAccount:
  annotations:
    azure.workload.identity/client-id: <loki-client-id>
backend: { replicas: 2 }
read: { replicas: 2 }
write: { replicas: 3 }
