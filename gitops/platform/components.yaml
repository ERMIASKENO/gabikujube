# Single source of truth for cluster add-ons and their pinned versions.
# scripts/ops/render-cluster-apps.sh turns this into the per-env platform
# ApplicationSet (list generator). Renovate bumps the versions via PR.
#
# Versions verified against upstream release tags on 2026-11-26.
# kyverno chart 3.10.x ships Kyverno v1.20.
# wave: lower syncs first (CRDs/mesh before things that use them)
components:
  - { name: istio-base,            namespace: istio-system,     repo: https://istio-release.storage.googleapis.com/charts, chart: base,                 version: 1.32.0,  wave: "-10" }
  - { name: istio-cni,             namespace: istio-system,     repo: https://istio-release.storage.googleapis.com/charts, chart: cni,                  version: 1.32.0,  wave: "-9" }
  - { name: istiod,                namespace: istio-system,     repo: https://istio-release.storage.googleapis.com/charts, chart: istiod,               version: 1.32.0,  wave: "-8" }
  - { name: cert-manager,          namespace: cert-manager,     repo: https://charts.jetstack.io,                          chart: cert-manager,         version: v1.21.3, wave: "-10" }
  - { name: external-secrets,      namespace: external-secrets, repo: https://charts.external-secrets.io,                  chart: external-secrets,     version: 2.15.0,  wave: "-10" }
  - { name: kyverno,               namespace: kyverno,          repo: https://kyverno.github.io/kyverno/,                  chart: kyverno,              version: 3.10.0,   wave: "-10" }
  - { name: argo-rollouts,         namespace: argo-rollouts,    repo: https://argoproj.github.io/argo-helm,                chart: argo-rollouts,        version: 2.43.12,  wave: "-5" }
  - { name: kube-prometheus-stack, namespace: monitoring,       repo: https://prometheus-community.github.io/helm-charts,  chart: kube-prometheus-stack, version: 94.1.0, wave: "-5" }
  - { name: loki,                  namespace: monitoring,       repo: https://grafana.github.io/helm-charts,               chart: loki,                 version: 7.7.0,  wave: "-4" }
  - { name: tempo,                 namespace: monitoring,       repo: https://grafana.github.io/helm-charts,               chart: tempo,                version: 1.24.4,  wave: "-4" }
  - { name: alloy,                 namespace: monitoring,       repo: https://grafana.github.io/helm-charts,               chart: alloy,                version: 1.16.0,   wave: "-3" }
  - { name: reloader,              namespace: kube-system,      repo: https://stakater.github.io/stakater-charts,          chart: reloader,             version: 2.2.21,   wave: "-3" }
# CI runners never run in staging/prod clusters (blast radius): dev/tools only
dev_only:
  - { name: arc-controller,        namespace: arc-systems,      repo: ghcr.io/actions/actions-runner-controller-charts,    chart: gha-runner-scale-set-controller, version: 0.15.1, wave: "-3" }
  - { name: arc-runners,           namespace: arc-runners,      repo: ghcr.io/actions/actions-runner-controller-charts,    chart: gha-runner-scale-set,            version: 0.15.1, wave: "-2" }
