{{- if .Values.externalSecret.enabled }}
# Key Vault -> Kubernetes Secret, refreshed hourly. Rotation in Key Vault
# propagates here; Stakater Reloader restarts pods when the Secret changes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "ms.name" . }}
  labels:
    {{- include "ms.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"   # secret exists before pods/migration job start
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    name: {{ include "ms.name" . }}-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range .Values.externalSecret.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteKey }}
    {{- end }}
{{- end }}
