{{- /*
  canary:    <name> (mesh parent for the HTTPRoute) + <name>-stable + <name>-canary
  blueGreen: <name> + <name>-stable (active) + <name>-preview
  rolling:   <name>
  Argo Rollouts injects the rollouts-pod-template-hash selector into
  -stable/-canary/-preview at runtime.
*/ -}}
{{- range (include "ms.backendServices" . | splitList ",") }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ . }}
  labels:
    {{- include "ms.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ms.selectorLabels" $ | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      appProtocol: http
{{- end }}
