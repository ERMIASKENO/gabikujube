apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ms.name" . }}
  labels:
    {{- include "ms.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.workloadIdentityClientId }}
  annotations:
    # Workload Identity webhook injects AZURE_CLIENT_ID/TENANT_ID/FEDERATED_TOKEN_FILE
    azure.workload.identity/client-id: {{ . | quote }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
