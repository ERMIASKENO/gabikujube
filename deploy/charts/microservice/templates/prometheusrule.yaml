{{- if .Values.slo.enabled }}
{{- $name := include "ms.name" . -}}
{{- $ns := .Release.Namespace -}}
# SLO alerts from Istio telemetry (language-agnostic, same for every service).
# Multi-window burn rate: page on fast burn, ticket on slow burn.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $name }}-slo
  labels:
    {{- include "ms.labels" . | nindent 4 }}
    release: kube-prometheus-stack
spec:
  groups:
    - name: {{ $name }}.slo
      rules:
        - record: shopsphere:request_error_ratio:rate5m
          labels: { service: {{ $name }} }
          expr: |
            sum(rate(istio_requests_total{reporter="destination",destination_workload="{{ $name }}",destination_workload_namespace="{{ $ns }}",response_code=~"5.."}[5m]))
            /
            sum(rate(istio_requests_total{reporter="destination",destination_workload="{{ $name }}",destination_workload_namespace="{{ $ns }}"}[5m]))
        - record: shopsphere:request_error_ratio:rate1h
          labels: { service: {{ $name }} }
          expr: |
            sum(rate(istio_requests_total{reporter="destination",destination_workload="{{ $name }}",destination_workload_namespace="{{ $ns }}",response_code=~"5.."}[1h]))
            /
            sum(rate(istio_requests_total{reporter="destination",destination_workload="{{ $name }}",destination_workload_namespace="{{ $ns }}"}[1h]))
        - alert: {{ $name | replace "-" "" | title }}ErrorBudgetFastBurn
          expr: |
            shopsphere:request_error_ratio:rate5m{service="{{ $name }}"} > (14.4 * {{ .Values.slo.errorBudgetRatio }})
            and
            shopsphere:request_error_ratio:rate1h{service="{{ $name }}"} > (14.4 * {{ .Values.slo.errorBudgetRatio }})
          for: 2m
          labels: { severity: page, service: {{ $name }} }
          annotations:
            summary: "{{ $name }} is burning its error budget 14x too fast"
            runbook_url: https://github.com/ERMIASKENO/gabikujube/blob/main/docs/RUNBOOK.md#error-budget-burn
        - alert: {{ $name | replace "-" "" | title }}LatencyP95High
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(istio_request_duration_milliseconds_bucket{reporter="destination",destination_workload="{{ $name }}",destination_workload_namespace="{{ $ns }}"}[5m]))) > {{ .Values.slo.latencyP95Ms }}
          for: 10m
          labels: { severity: ticket, service: {{ $name }} }
          annotations:
            summary: "{{ $name }} p95 latency above {{ .Values.slo.latencyP95Ms }}ms"
{{- end }}
