# Local stand-in for the Istio Gateway + HTTPRoutes in
# gitops/cluster-config/base/gateway/httproutes.yaml. Keep the two in sync.
server {
    listen 8080;
    resolver 127.0.0.11 valid=10s;   # docker embedded DNS
    set $svc_frontend        http://frontend:8080;
    set $svc_products        http://product-catalog:8080;
    set $svc_cart            http://cart:8080;
    set $svc_orders          http://order:8080;
    set $svc_users           http://user:8080;
    set $svc_recommendations http://recommendation:8080;

    location /api/products        { proxy_pass $svc_products; }
    location /api/cart            { proxy_pass $svc_cart; }
    location /api/orders          { proxy_pass $svc_orders; }
    location /api/users           { proxy_pass $svc_users; }
    location /.well-known/        { proxy_pass $svc_users; }
    location /api/recommendations { proxy_pass $svc_recommendations; }
    location /                    { proxy_pass $svc_frontend; }
}
